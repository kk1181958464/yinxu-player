appId: com.gina.kugou-player
productName: 音序
directories:
  output: release
files:
  - out/**/*
extraResources:
  - from: server
    to: server
    filter:
      - "**/*"
      - "!**/.git/**"
      - "!**/*.log"
  - from: resources
    to: resources
    filter:
      - "**/*"
win:
  target:
    - nsis
  icon: resources/icon.ico
nsis:
  shortcutName: 音序
  artifactName: Yinxu-${version}-setup.${ext}
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
publish:
  provider: github
  owner: kk1181958464
  repo: yinxu-player
